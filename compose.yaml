name: checkstock

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: checkstock
      POSTGRES_USER: checkstock
      POSTGRES_PASSWORD: checkstock-local
    volumes:
      - data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkstock -d checkstock"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  setup:
    build:
      context: .
      target: runtime
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://checkstock:checkstock-local@db:5432/checkstock
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    depends_on:
      db:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  app:
    build:
      context: .
      target: runtime
    environment:
      <<: *app-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
    ports:
      - "127.0.0.1:${CHECKSTOCK_PORT:-18120}:8000"
    depends_on:
      setup:
        condition: service_completed_successfully
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  test-db:
    image: postgres:18.6-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: checkstock_test
      POSTGRES_USER: checkstock
      POSTGRES_PASSWORD: checkstock-test
    tmpfs: ["/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkstock -d checkstock_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://checkstock:checkstock-test@test-db:5432/checkstock_test
    depends_on:
      test-db:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

volumes:
  data:
